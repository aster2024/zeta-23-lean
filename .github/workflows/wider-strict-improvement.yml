name: Wider strict improvement

on:
  workflow_dispatch:
  push:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "Zeta23.lean"
      - "Zeta23/StrictImprovement/**"
      - "comparator/PrintAxioms/StrictImprovement.lean"
      - "comparator/PrintAxioms/WiderStrictImprovement.lean"
      - ".github/workflows/wider-strict-improvement.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "Zeta23.lean"
      - "Zeta23/StrictImprovement/**"
      - "comparator/PrintAxioms/StrictImprovement.lean"
      - "comparator/PrintAxioms/WiderStrictImprovement.lean"
      - ".github/workflows/wider-strict-improvement.yml"

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the frozen source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Restore the project Lean build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .lake/build
          key: >-
            zeta23-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            zeta23-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Record the exact build identity
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee build-commit.txt
          lean --version | tee lean-version.txt
          lake --version | tee lake-version.txt
          git -C .lake/packages/mathlib rev-parse HEAD | tee mathlib-commit.txt
          printf '%s\n' \
            lean-toolchain \
            lakefile.toml \
            lake-manifest.json \
            Zeta23.lean \
            .github/workflows/wider-strict-improvement.yml \
            comparator/PrintAxioms/StrictImprovement.lean \
            comparator/PrintAxioms/WiderStrictImprovement.lean \
            $(git ls-files 'Zeta23/StrictImprovement/*.lean') |
            LC_ALL=C sort -u |
            xargs sha256sum > build-inputs.sha256

      - name: Build the wider targets and default root
        run: |
          set -uo pipefail
          publish_failure() {
            local log_file=$1
            local title=$2
            python3 - "${log_file}" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as stream:
              lines = stream.read().splitlines()
          signal = re.compile(
              r"(?:^|\s)error:|✖|failed to build|unknown declaration|"
              r"declaration has metavariables|unsolved goals|type mismatch"
          )
          selected = set()
          for index, line in enumerate(lines):
              if signal.search(line):
                  selected.update(range(max(0, index - 8), min(len(lines), index + 31)))
          if not selected:
              selected.update(range(max(0, len(lines) - 160), len(lines)))
          with open("lean-failure-diagnostics.txt", "w", encoding="utf-8") as out:
              previous = None
              for index in sorted(selected):
                  line = lines[index]
                  if line.startswith("trace: "):
                      continue
                  if previous is not None and index > previous + 1:
                      out.write("-- omitted --\n")
                  out.write(f"{index + 1}:{line[:1200]}\n")
                  previous = index
          PY
            head -n 400 lean-failure-diagnostics.txt \
              > lean-failure-diagnostics-bounded.txt
            {
              printf '### %s\n\n```text\n' "${title}"
              cat lean-failure-diagnostics-bounded.txt
              printf '```\n'
            } >> "${GITHUB_STEP_SUMMARY}"

            diagnostic=$(cat lean-failure-diagnostics-bounded.txt)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=%s::%s\n' "${title}" "${diagnostic}"
          }

          set +e
          run_preflight() {
            local target=$1
            local log_file=$2
            local title=$3
            lake build "${target}" 2>&1 | tee "${log_file}"
            local status=${PIPESTATUS[0]}
            if [[ "${status}" -ne 0 ]]; then
              publish_failure "${log_file}" "${title}"
              exit "${status}"
            fi
          }

          run_preflight Zeta23.StrictImprovement.LocalPinching \
            local-pinching-build.log "Local pinching preflight failure"
          run_preflight Zeta23.StrictImprovement.ExplicitDelta \
            explicit-delta-build.log "Explicit delta preflight failure"
          run_preflight Zeta23.StrictImprovement.GramTriples \
            gram-triples-build.log "Gram triples preflight failure"
          run_preflight Zeta23.StrictImprovement.EndpointTaylorRefinement \
            endpoint-taylor-build.log "Endpoint Taylor preflight failure"
          run_preflight Zeta23.StrictImprovement.QuadraticGain \
            quadratic-gain-build.log "Quadratic gain preflight failure"
          run_preflight Zeta23.StrictImprovement.WiderQuadraticGain \
            wider-quadratic-gain-build.log "Wider quadratic gain preflight failure"
          run_preflight Zeta23.StrictImprovement.KernelRoots \
            kernel-roots-build.log "Kernel roots preflight failure"
          run_preflight Zeta23.StrictImprovement.WindowFourierLimit \
            window-fourier-limit-build.log "Window Fourier limit preflight failure"
          run_preflight Zeta23.StrictImprovement.GramDefectLower \
            gram-defect-lower-build.log "Gram defect lower preflight failure"
          run_preflight Zeta23.StrictImprovement.RootLocalization \
            root-localization-build.log "Root localization preflight failure"
          run_preflight Zeta23.StrictImprovement.KernelStability \
            kernel-stability-build.log "Kernel stability preflight failure"
          run_preflight Zeta23.StrictImprovement.TriplePackingCount \
            triple-packing-count-build.log "Triple packing count preflight failure"
          run_preflight Zeta23.StrictImprovement.WiderRootArithmetic \
            wider-root-arithmetic-build.log "Wider root arithmetic preflight failure"
          run_preflight Zeta23.StrictImprovement.BinnedEnumerationFiber \
            binned-enumeration-fiber-build.log "Binned enumeration fiber preflight failure"
          run_preflight Zeta23.StrictImprovement.CorrelationNormalization \
            correlation-normalization-build.log "Correlation normalization preflight failure"
          run_preflight Zeta23.StrictImprovement.FiniteFullNormalization \
            finite-full-normalization-build.log "Finite/full normalization preflight failure"
          run_preflight Zeta23.StrictImprovement.WiderRootNeighborhood \
            wider-root-neighborhood-build.log "Wider root neighborhood preflight failure"
          run_preflight Zeta23.StrictImprovement.CoreComplement \
            core-complement-build.log "Core complement preflight failure"
          run_preflight Zeta23.StrictImprovement.ZetaCore \
            zeta-core-build.log "Zeta core preflight failure"
          run_preflight Zeta23.StrictImprovement.ZetaFiniteNormalization \
            zeta-finite-normalization-build.log \
            "Zeta finite normalization preflight failure"

          lake build \
            Zeta23.StrictImprovement.ZetaWiderEndpointPassage \
            Zeta23.StrictImprovement.WiderFixedInterfaceCeiling \
            2>&1 | tee wider-target-build.log
          target_status=${PIPESTATUS[0]}
          if [[ "${target_status}" -ne 0 ]]; then
            publish_failure wider-target-build.log "Wider target build failure"
            exit "${target_status}"
          fi

          lake build 2>&1 | tee wider-build.log
          build_status=${PIPESTATUS[0]}
          if [[ "${build_status}" -ne 0 ]]; then
            publish_failure wider-build.log "Default-root build failure"
            exit "${build_status}"
          fi
          set -e

      - name: Compare baseline and wider axiom sets
        run: |
          set -euo pipefail
          lake env lean comparator/PrintAxioms/StrictImprovement.lean \
            2>&1 | tee baseline-axioms.txt
          lake env lean comparator/PrintAxioms/WiderStrictImprovement.lean \
            2>&1 | tee wider-axioms.txt

          if grep -Eq 'sorryAx|unsafeAx' wider-axioms.txt; then
            printf 'forbidden axiom in wider endpoint\n' >&2
            exit 1
          fi

          extract_axiom_union() {
            sed -n 's/.*depends on axioms: \[\(.*\)\]$/\1/p' "$1" |
              tr ',' '\n' |
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' |
              LC_ALL=C sort -u
          }

          extract_axiom_union baseline-axioms.txt > baseline-axiom-set.txt
          extract_axiom_union wider-axioms.txt > wider-axiom-set.txt

          test -s baseline-axiom-set.txt
          test -s wider-axiom-set.txt
          cmp baseline-axiom-set.txt wider-axiom-set.txt

      - name: Preserve build and axiom receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wider-strict-improvement-receipts
          path: |
            wider-build.log
            wider-target-build.log
            lean-failure-diagnostics.txt
            lean-failure-diagnostics-bounded.txt
            local-pinching-build.log
            explicit-delta-build.log
            gram-triples-build.log
            endpoint-taylor-build.log
            quadratic-gain-build.log
            wider-quadratic-gain-build.log
            kernel-roots-build.log
            window-fourier-limit-build.log
            gram-defect-lower-build.log
            root-localization-build.log
            kernel-stability-build.log
            triple-packing-count-build.log
            wider-root-arithmetic-build.log
            binned-enumeration-fiber-build.log
            correlation-normalization-build.log
            finite-full-normalization-build.log
            wider-root-neighborhood-build.log
            core-complement-build.log
            zeta-core-build.log
            zeta-finite-normalization-build.log
            build-commit.txt
            lean-version.txt
            lake-version.txt
            mathlib-commit.txt
            build-inputs.sha256
            baseline-axioms.txt
            wider-axioms.txt
            baseline-axiom-set.txt
            wider-axiom-set.txt
          if-no-files-found: warn
          retention-days: 90
